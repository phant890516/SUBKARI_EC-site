{% extends "base.html" %}
{% block title %}出品中の商品{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4">
    <h1 class="text-2xl font-bold text-center mb-12 pt-[100px]">出品中の商品</h1>

    <div class="bg-white rounded-lg shadow-sm p-6 mb-8">
        <div class="flex flex-col md:flex-row gap-6 items-start">
            <div class="w-[450px] h-[275px] flex-shrink-0 overflow-hidden">
                <img src="{{ url_for('static', filename='img/productImg/' + (recent.img if recent and recent.img else 'default.png')) }}"
                     alt="商品画像" class="w-full rounded-lg object-cover">
            </div>
            {% if recent %}
            <div class="flex-1">
                <h3 class="font-bold mb-2">最近の商品</h3>
                <p class="font-semibold">{{ recent.name }}</p>
                <p class="text-gray-600 mb-6">{{ recent.explanation }}</p>
                <div class="flex flex-col gap-2">
                    <button class="w-full md:w-40 px-6 py-2 border border-gray-300 rounded hover:bg-gray-50 transition cursor-pointer"
                            onclick="editProduct({{ recent.id }})">編集する</button>
                    <button class="w-full md:w-40 px-6 py-2 border border-gray-300 rounded hover:bg-gray-50 transition cursor-pointer"
                            onclick="deleteProduct({{ recent.id }})">削除する</button>
                </div>
            </div>
            {% else %}
            <div class="mx-auto my-auto"><p>まだ出品している商品がありません</p></div>
            {% endif %}
        </div>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        {% for product in products %}
        <div class="bg-white rounded-lg shadow-sm p-3 product-item {% if loop.index > 4 %}hidden{% endif %}" data-index="{{ loop.index }}">
            <div class="w-[148px] h-[176px] bg-gray-500 shadow-sm overflow-hidden mb-3">
                <img src="{{ url_for('static', filename='img/productImg/' + (product.img if product and product.img else 'default.png')) }}"
                     alt="{{ product.name }}" class="w-full object-cover">
            </div>
            <p class="text-center text-sm mb-2 truncate">{{ product.name }}</p>
            <button class="w-full px-4 py-2 mb-2 border border-gray-300 rounded text-sm hover:bg-gray-50 transition cursor-pointer"
                    onclick="editProduct({{ product.id }})">編集する</button>
            <button class="w-full px-4 py-2 border border-gray-300 rounded text-sm hover:bg-gray-50 transition cursor-pointer"
                    onclick="deleteProduct({{ product.id }})">削除する</button>
        </div>
        {% endfor %}
    </div>

    <div class="flex justify-center mb-12">
        <a href="{{ url_for('seller.seller_format') }}">
            <button type="button" class="px-8 py-3 bg-[#837575] text-white font-bold rounded hover:bg-gray-700 transition cursor-pointer">
                新しく出品する
            </button>
        </a>
    </div>
</div>
<script src="{{ url_for('static', filename='js/seller_format.js') }}"></script>
{% endblock %}
